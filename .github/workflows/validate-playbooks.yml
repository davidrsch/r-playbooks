name: Validate Playbooks

on:
    push:
        paths:
            - "playbooks/**/PLAYBOOK.md"
            - ".github/playbook-schema.json"
            - ".github/playbook-validate.R"
    pull_request:
        paths:
            - "playbooks/**/PLAYBOOK.md"
            - ".github/playbook-schema.json"
            - ".github/playbook-validate.R"
    workflow_dispatch:

jobs:
    validate:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: r-lib/actions/setup-r@v2
              with:
                  r-version: "4.4"

            - name: Install R dependencies
              run: |
                  install.packages(c("yaml", "jsonlite"), repos = "https://cloud.r-project.org")
              shell: Rscript {0}

            - name: Validate playbooks
              run: Rscript .github/playbook-validate.R
