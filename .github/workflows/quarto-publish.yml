name: Quarto Publish

on:
    push:
        branches: [main]
    workflow_dispatch:

permissions:
    contents: write
    pages: write
    id-token: write

jobs:
    build-deploy:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Setup R
              uses: r-lib/actions/setup-r@v2
              with:
                  r-version: "release"
                  use-public-rspm: true

            - name: Install R dependencies
              run: |
                  install.packages(c("yaml", "remotes"))
              shell: Rscript {0}

            - name: Setup Quarto
              uses: quarto-dev/quarto-actions/setup@v2
              with:
                  version: "pre-release"

            - name: Render
              run: quarto render

            - name: Deploy to GitHub Pages
              uses: peaceiris/actions-gh-pages@v4
              with:
                  github_token: ${{ secrets.GITHUB_TOKEN }}
                  publish_dir: ./docs
                  publish_branch: gh-pages
                  force_orphan: true
