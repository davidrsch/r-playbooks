name: Quarto Publish

on:
    push:
        branches: [main]
    workflow_dispatch:

permissions:
    contents: write

jobs:
    deploy:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: quarto-dev/quarto-actions/setup@v2
              with:
                  version: "1.6.43"

            - uses: r-lib/actions/setup-r@v2
              with:
                  r-version: "4.4"
                  use-public-rspm: true

            - name: Install R dependencies
              run: Rscript -e 'install.packages(c("yaml"), repos = "https://cloud.r-project.org")'

            - name: Render site
              run: quarto render

            - uses: peaceiris/actions-gh-pages@v4
              with:
                  github_token: ${{ secrets.GITHUB_TOKEN }}
                  publish_dir: ./docs
                  publish_branch: gh-pages
                  force_orphan: true
