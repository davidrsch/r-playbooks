project:
  type: website
  output-dir: docs
  render:
    - index.qmd

website:
  title: "R Playbooks"
  site-url: https://davidrsch.github.io/r-playbooks/
  repo-url: https://github.com/davidrsch/r-playbooks/
  navbar:
    background: primary
    search: true
    left:
      - text: "Playbooks"
        href: index.qmd
      - text: "GitHub"
        href: https://github.com/davidrsch/r-playbooks/
        icon: github

  page-footer:
    left: "R Playbooks — curated AI coding playbooks for R development"
    right: "Built with [Quarto](https://quarto.org/)"

format:
  html:
    theme:
      light: cosmo
      dark: darkly
    css: styles.css
    toc: false
    page-layout: full
    include-after-body: card-script.html
    include-in-header:
      - text: '<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>'

execute:
  freeze: auto
